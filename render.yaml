services:
  - type: web
    name: yegna-bet-platform
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 app:app
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: ADMIN_TELEGRAM_ID
        value: "8488592165"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
